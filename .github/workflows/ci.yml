name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  calidad:
    name: Lint + tipos + pruebas (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          # El proyecto no usa uv.lock (instalamos con uv venv + uv pip install),
          # así que la clave de caché se calcula sobre pyproject.toml.
          cache-dependency-glob: "**/pyproject.toml"

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Instala la CLI en modo editable junto con las dependencias de desarrollo
      # (pytest, ruff, mypy) definidas en [project.optional-dependencies].dev.
      - name: Instalar proyecto + dependencias de desarrollo
        run: uv venv --python "${{ matrix.python-version }}" && uv pip install -e ".[dev]"

      - name: Linting (ruff)
        run: uv run --no-sync ruff check

      - name: Type checking (mypy)
        run: uv run --no-sync mypy

      - name: Pruebas (pytest)
        run: uv run --no-sync pytest -ra

  # Simula EXACTAMENTE lo que haría otra persona (p. ej. el profesor) siguiendo
  # el README: instalar la CLI en un entorno limpio y usarla desde el PATH.
  install-smoke:
    name: Instalación limpia (uv tool install + smoke)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # `uv tool install .` crea un venv aislado como haría un usuario final;
      # si uv faltara por cualquier motivo, se cae a `pipx install .`.
      - name: Instalar la CLI como herramienta global (uv tool install)
        run: |
          set -euo pipefail
          if command -v uv >/dev/null 2>&1; then
            uv tool install .
          else
            pipx install .
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Smoke — limpiador version imprime la versión
        run: limpiador version | grep -E "limpiador [0-9]+\.[0-9]+"

      - name: Smoke — limpiador doctor sale 0
        run: limpiador doctor

      # La ayuda debe listar TODAS las órdenes, incluidas las nuevas
      # `deshacer` (papelera) y `doctor` (instalación limpia).
      - name: Smoke — limpiador --help lista todas las órdenes
        run: |
          set -euo pipefail
          AYUDA="$(limpiador --help)"
          echo "$AYUDA"
          for orden in version listar acciones validar ejecutar deshacer doctor; do
            echo "$AYUDA" | grep -q "$orden" || {
              echo "FALTA la orden '$orden' en --help"; exit 1;
            }
          done

  # La suite de pytest también en los tres sistemas operativos: la CLI se
  # distribuye para que cualquiera la use, no solo en Linux.
  os-matrix:
    name: Pruebas en ${{ matrix.os }} (Python 3.12)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar proyecto + dependencias de desarrollo
        run: uv venv --python "3.12" && uv pip install -e ".[dev]"
        shell: bash

      - name: Pruebas (pytest)
        run: uv run --no-sync pytest -ra
        shell: bash
