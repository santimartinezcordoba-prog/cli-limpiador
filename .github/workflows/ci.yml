name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Job 1 — calidad estática: ruff + mypy (ubuntu + Python 3.12).
  lint:
    name: Lint (ruff) + tipos (mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          # El proyecto no usa uv.lock: la clave de caché se calcula sobre
          # pyproject.toml.
          cache-dependency-glob: "**/pyproject.toml"

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar proyecto + dependencias de desarrollo
        run: uv venv --python "3.12" && uv pip install -e ".[dev]"

      - name: Linting (ruff)
        run: uv run --no-sync ruff check

      - name: Type checking (mypy)
        run: uv run --no-sync mypy

  # Job 2 — pytest con cobertura (umbral 80% fijado en pyproject.toml) en la
  # matriz del enunciado: ubuntu/macos/windows × Python 3.11/3.12, más el
  # 3.10 en ubuntu (versión mínima soportada).
  test:
    name: Pruebas (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]
        include:
          - os: ubuntu-latest
            python-version: "3.10"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar proyecto + dependencias de desarrollo
        run: uv venv --python "${{ matrix.python-version }}" && uv pip install -e ".[dev]"
        shell: bash

      # `pytest -q` lleva en addopts --cov --cov-fail-under=80 (pyproject):
      # si la cobertura baja del 80 %, este job falla.
      - name: Pruebas con cobertura (pytest -q)
        run: uv run --no-sync pytest -q
        shell: bash

  # Job 3 — CLAVE de instalación: simula EXACTAMENTE lo que hará el profesor
  # con el README, en un entorno limpio (ubuntu + Python 3.12): instala la CLI
  # como herramienta global y la usa desde el PATH.
  install-smoke:
    name: Instalación limpia (uv tool install + smoke del README)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar la CLI como herramienta global (uv tool install)
        run: |
          set -euo pipefail
          if command -v uv >/dev/null 2>&1; then
            uv tool install .
          else
            pipx install .
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Smoke — limpiador version imprime la versión
        run: limpiador version | grep -E "limpiador [0-9]+\.[0-9]+"

      # La ayuda debe listar TODAS las órdenes, incluidas `deshacer` y
      # `doctor`.
      - name: Smoke — limpiador --help lista todas las órdenes
        run: |
          set -euo pipefail
          AYUDA="$(limpiador --help)"
          echo "$AYUDA"
          for orden in version listar acciones validar ejecutar deshacer doctor; do
            echo "$AYUDA" | grep -q "$orden" || {
              echo "FALTA la orden '$orden' en --help"; exit 1;
            }
          done

      # Con el acciones.json de ejemplo del repo (config de ejemplo):
      # validar debe salir 0 y `--simular` no puede tocar el disco.
      - name: Smoke — limpiador validar con el acciones.json de ejemplo
        run: |
          set -euo pipefail
          limpiador --config ./acciones.json validar
          limpiador validar --json | grep -q '"valido": true'

      - name: Smoke — limpiador doctor sale 0
        run: limpiador doctor

      # Hash del ÁRBOL COMPLETO (carpetas + ficheros), no solo ficheros:
      # así se detectan también las carpetas «fantasma» que una planificación
      # descuidada podría crear (p. ej. papelera/<marca>/ vacía al simular).
      # Con `pip install .` en un venv NO se instala el paquete `rich` de forma
      # aislada… sí se instala, pero `python -m pip` es más robusto frente a
      # espacios en PATH. El problema real que arreglamos aquí: `limpiador`
      # (y `sha256sum`) viven en `$(python -m site --user-base)/bin`, que no
      # está en PATH en los runners. Lo exponemos explícitamente en cada paso.
      - name: Smoke — --simular sobre una carpeta de prueba no escribe
        run: |
          set -euo pipefail
          # El binario global quedó en ~/.local/bin (añadido a GITHUB_PATH),
          # pero GITHUB_PATH solo afecta a PASOS FUTUROS: dentro de este paso
          # lo reexportamos para que `limpiador` sea resoluble ya.
          export PATH="$HOME/.local/bin:$PATH"
          rm -rf /tmp/smoke-pruebas
          mkdir -p /tmp/smoke-pruebas
          printf 'x' > /tmp/smoke-pruebas/foto.png
          printf 'x' > /tmp/smoke-pruebas/basura.tmp
          hash_arbol() {
            # Rutas relativas + tipo + contenido de todo el árbol, ordenadas:
            # cualquier carpeta/fichero nuevo o cambiado altera el hash.
            find "$1" | LC_ALL=C sort | while IFS= read -r ruta; do
              if [ -d "$ruta" ]; then
                printf 'D %s\n' "${ruta#"$1"}"
              elif [ -f "$ruta" ]; then
                printf 'F %s %s\n' "${ruta#"$1"}" "$(sha256sum < "$ruta")"
              fi
            done | sha256sum
          }
          command -v limpiador >/dev/null || { echo "limpiador NO está en PATH"; exit 1; }
          ANTES=$(hash_arbol /tmp/smoke-pruebas)
          limpiador --config ./acciones.json ejecutar mover-imagenes /tmp/smoke-pruebas --simular
          limpiador --config ./acciones.json ejecutar borrar-temporales /tmp/smoke-pruebas --simular
          DESPUES=$(hash_arbol /tmp/smoke-pruebas)
          test "$ANTES" = "$DESPUES" || { echo "--simular TOCO el disco"; exit 1; }
          test -d /tmp/smoke-pruebas/imagenes && { echo "--simular creó carpetas"; exit 1; }
          test -d /tmp/smoke-pruebas/papelera && { echo "--simular creó la papelera"; exit 1; }
