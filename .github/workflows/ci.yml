name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  calidad:
    name: Lint + tipos + pruebas (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Instala la CLI en modo editable junto con las dependencias de desarrollo
      # (pytest, ruff, mypy) definidas en [project.optional-dependencies].dev.
      - name: Instalar proyecto + dependencias de desarrollo
        run: uv venv --python "${{ matrix.python-version }}" && uv pip install -e ".[dev]"

      - name: Linting (ruff)
        run: uv run --no-sync ruff check

      - name: Type checking (mypy)
        run: uv run --no-sync mypy

      - name: Pruebas (pytest)
        run: uv run --no-sync pytest -ra

  instalacion:
    name: Instalación global + smoke test
    runs-on: ubuntu-latest
    needs: calidad
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      # Comprueba que la CLI se instala como comando global igual que haría un
      # usuario con `uv tool install git+https://.../cli-limpiador.git`.
      - name: Instalar la CLI como herramienta global (uv tool install)
        run: uv tool install .

      # Smoke test: el comando debe estar en el PATH y responder.
      - name: Smoke test (limpiador version)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          which limpiador
          limpiador version
          limpiador --help
